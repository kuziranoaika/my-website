<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>満月うさぎカフェ</title>
<style>
  :root {
    --bg: #faf6ef;
    --text: #4a3a2a;
    --accent: #b98a5e;
    --accent-deep: #8a6342;
    --sub: #f3e9da;
    --card: #fffdf8;
    --border: #e6d8c2;
    --shadow: 0 2px 12px rgba(120,90,50,0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Hiragino Maru Gothic Pro', 'BIZ UDPGothic', 'Yu Gothic', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    letter-spacing: 0.03em;
  }
  body.dark {
    --bg: #000;
    --text: #c8ffc8;
    --accent: #00ff41;
    --accent-deep: #00ff41;
    --sub: #0a0a0a;
    --card: #050505;
    --border: #1a3a1a;
    --shadow: none;
    font-family: 'Courier New', 'MS Gothic', monospace;
  }

  /* ============ ヘッダー ============ */
  #site-header {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 20px 28px 14px;
    box-shadow: var(--shadow);
    position: sticky; top: 0; z-index: 50;
  }
  body.dark #site-header { background: #000; border-bottom: 1px solid #1a3a1a; box-shadow: none; }
  .header-top {
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 12px; max-width: 960px; margin: 0 auto;
  }
  #site-title {
    font-family: 'Shippori Mincho', 'Yu Mincho', serif;
    font-size: 1.45rem; color: var(--accent-deep);
    letter-spacing: 4px; cursor: pointer; font-weight: 600;
  }
  body.dark #site-title { font-family: monospace; color: #00ff41; letter-spacing: 2px; }

  .header-tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  #search-input {
    padding: 8px 16px; border: 1px solid var(--border);
    border-radius: 24px; font-size: 0.85rem; width: 200px;
    background: var(--bg); color: var(--text); font-family: inherit;
    outline: none; transition: border 0.2s;
  }
  #search-input:focus { border-color: var(--accent); }
  body.dark #search-input {
    background: #000; color: #00ff41; border: 1px solid #00ff41; border-radius: 0;
  }
  .tool-btn {
    background: none; border: 1px solid var(--border); color: var(--accent-deep);
    padding: 7px 14px; border-radius: 24px; cursor: pointer;
    font-size: 0.78rem; font-family: inherit; transition: all 0.2s;
    white-space: nowrap;
  }
  .tool-btn:hover { background: var(--sub); }
  body.dark .tool-btn { border-color: #1a3a1a; color: #888; border-radius: 0; }
  body.dark .tool-btn:hover { background: #0a0a0a; color: #00ff41; }

  nav#main-nav {
    display: flex; gap: 4px 18px; flex-wrap: wrap; justify-content: center;
    max-width: 960px; margin: 14px auto 0; padding-top: 12px;
    border-top: 1px dotted var(--border);
  }
  nav#main-nav a {
    font-size: 0.82rem; color: var(--text); text-decoration: none;
    padding: 4px 6px; cursor: pointer; position: relative; transition: color 0.2s;
  }
  nav#main-nav a:hover { color: var(--accent); }
  nav#main-nav a::after {
    content: ''; position: absolute; left: 50%; bottom: 0; width: 0; height: 1px;
    background: var(--accent); transition: all 0.25s; transform: translateX(-50%);
  }
  nav#main-nav a:hover::after { width: 100%; }

  /* ============ 月（裏ページ） ============ */
  #moon-header {
    display: none; width: 100%; text-align: center; padding: 28px 0 4px;
    font-size: 6rem; line-height: 1;
    text-shadow: 0 0 50px #999, 0 0 100px #555;
    filter: grayscale(25%) contrast(1.4);
  }
  body.dark #moon-header { display: block; }

  /* ============ メイン ============ */
  #main { max-width: 880px; margin: 0 auto; padding: 48px 24px 80px; }
  body.dark #main { padding-top: 24px; }

  .page { display: none; animation: fadein 0.45s; }
  .page.active { display: block; }
  @keyframes fadein { from { opacity:0; transform: translateY(10px); } to { opacity:1; transform:none; } }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 40px 36px;
    margin-bottom: 32px;
    box-shadow: var(--shadow);
  }
  body.dark .card { border-radius: 0; }
  @media (max-width: 600px) { .card { padding: 28px 20px; } }

  h2 {
    font-family: 'Shippori Mincho', 'Yu Mincho', serif;
    font-size: 1.35rem; margin-bottom: 24px; color: var(--accent-deep);
    letter-spacing: 3px; font-weight: 600;
    padding-bottom: 12px; border-bottom: 2px dotted var(--border);
  }
  body.dark h2 { color: #00ff41; font-family: monospace; border-color: #1a3a1a; }
  h3 {
    font-size: 1rem; color: var(--accent-deep); margin: 24px 0 12px;
    letter-spacing: 2px;
  }
  body.dark h3 { color: #00ff41; }
  p { line-height: 2.1; font-size: 0.92rem; margin-bottom: 14px; }

  .tag {
    display: inline-block; background: var(--sub); border: 1px solid var(--border);
    border-radius: 20px; padding: 4px 14px; font-size: 0.8rem; margin: 3px;
  }
  .btn {
    background: var(--accent); color: #fff; border: none;
    padding: 11px 28px; border-radius: 24px; cursor: pointer;
    font-size: 0.88rem; transition: opacity 0.2s; font-family: inherit;
    letter-spacing: 1px;
  }
  .btn:hover { opacity: 0.85; }
  body.dark .btn { background: #00ff41; color: #000; border-radius: 0; }

  /* ============ うさぎカード ============ */
  .bunny-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 20px; }
  .bunny-card {
    background: var(--bg); border: 1px solid var(--border); border-radius: 14px;
    padding: 28px 16px; text-align: center; cursor: pointer;
    transition: transform 0.25s, box-shadow 0.25s;
  }
  .bunny-card:hover { transform: translateY(-4px); box-shadow: 0 6px 20px rgba(120,90,50,0.12); }
  .bunny-face { font-size: 3rem; margin-bottom: 10px; }
  .bunny-name { font-weight: bold; font-size: 1.05rem; color: var(--accent-deep); letter-spacing: 2px; margin-bottom: 6px; }

  /* ============ メニュー（画像風カード） ============ */
  .menu-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 22px; }
  .menu-photo {
    border-radius: 12px; overflow: hidden; position: relative;
    box-shadow: 0 4px 14px rgba(100,70,40,0.15);
    transition: transform 0.25s;
  }
  .menu-photo:hover { transform: translateY(-3px); }
  .menu-visual {
    height: 170px; display: flex; align-items: center; justify-content: center;
    font-size: 4.2rem; position: relative;
  }
  .menu-plaque {
    position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
    background: rgba(255,253,246,0.93); border: 1px solid #d9c5a5;
    border-radius: 8px; padding: 7px 18px; text-align: center;
    box-shadow: 0 2px 6px rgba(0,0,0,0.12); min-width: 150px;
  }
  .menu-plaque .m-name { font-size: 0.85rem; color: #6b5232; font-weight: bold; letter-spacing: 1px; }
  .menu-plaque .m-price { font-size: 0.9rem; color: #8a6342; font-family: 'Shippori Mincho', serif; }
  .new-badge {
    position: absolute; top: 10px; left: 10px; background: #a0714a; color: #fff;
    border-radius: 50%; width: 46px; height: 46px; display: flex; align-items: center;
    justify-content: center; font-size: 0.7rem; letter-spacing: 1px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
  }
  /* メニュー背景バリエーション */
  .v-tea { background: linear-gradient(135deg, #3d2b1f 0%, #7a5230 55%, #c9954e 100%); }
  .v-latte { background: linear-gradient(135deg, #e8d9c3 0%, #c89f6e 60%, #a0714a 100%); }
  .v-moon { background: linear-gradient(135deg, #1a2238 0%, #2e3a5c 60%, #5a4a7a 100%); }
  .v-milk { background: linear-gradient(135deg, #e8f0f8 0%, #ffffff 50%, #dce8f5 100%); }
  .v-carrot { background: linear-gradient(135deg, #e8893a 0%, #f5a94e 60%, #d97326 100%); }
  .v-pancake { background: linear-gradient(135deg, #2a3050 0%, #c9a35e 60%, #f0d9a8 100%); }
  .v-cookie { background: linear-gradient(135deg, #fdf3ec 0%, #f7e3d8 50%, #f0d4c8 100%); }
  .v-waffle { background: linear-gradient(135deg, #d9b88a 0%, #c49a66 50%, #ead9b8 100%); }
  .v-tart { background: linear-gradient(135deg, #fdf8f0 0%, #f5e8d5 50%, #e8d5b8 100%); }

  /* ============ ノート再現 ============ */
  .notebook {
    background: linear-gradient(135deg, #f5edda 0%, #f9f3e4 50%, #f2e9d4 100%);
    border: 1px solid #d9c9a5; border-radius: 6px;
    padding: 36px 32px; position: relative;
    box-shadow: 0 6px 18px rgba(90,70,40,0.18), inset 0 0 60px rgba(180,150,100,0.08);
    font-family: 'Yu Mincho', 'Hiragino Mincho ProN', serif;
  }
  .notebook::before {
    content: ''; position: absolute; top: 0; bottom: 0; left: 50%; width: 1px;
    background: linear-gradient(to bottom, transparent, #c9b58a 20%, #c9b58a 80%, transparent);
  }
  .nb-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 0 48px; }
  @media (max-width: 600px) { .nb-cols { grid-template-columns: 1fr; } .notebook::before { display: none; } }
  .nb-entry {
    padding: 14px 4px; border-bottom: 1px dashed #d4c39a;
    font-size: 0.86rem; line-height: 1.95; color: #3d3020;
  }
  .nb-entry:last-child { border-bottom: none; }
  .nb-num {
    display: inline-block; width: 22px; height: 22px; border: 1.5px solid #5a4a32;
    border-radius: 50%; text-align: center; line-height: 20px; font-size: 0.72rem;
    margin-right: 8px; color: #5a4a32;
  }
  .nb-doodle { text-align: right; font-size: 1rem; opacity: 0.75; }
  .file-label {
    position: absolute; top: 7px; left: 10px;
    font-family: 'Courier New', monospace; font-size: 0.68rem;
    color: #a89878; letter-spacing: 0.5px; opacity: 0.85; z-index: 2;
  }

  /* ============ ブログ・ノート引用 ============ */
  .blog-entry { border-left: 3px solid var(--accent); padding: 4px 0 4px 18px; margin-bottom: 28px; }
  body.dark .blog-entry { border-color: #00ff41; }
  .blog-date { font-size: 0.78rem; color: #b0a088; margin-bottom: 8px; letter-spacing: 1px; }
  .note-quote {
    border: 1px solid var(--border); padding: 24px 28px;
    background: var(--sub); border-radius: 10px; margin: 16px 0;
    font-family: 'Yu Mincho', serif;
  }
  body.dark .note-quote { background: #0a0a0a; border-color: #00ff41; font-family: monospace; }

  /* ============ ターミナル ============ */
  .terminal {
    background: #000; color: #00ff41; font-family: 'Courier New', monospace;
    padding: 32px 28px; border: 1px solid #00ff41; font-size: 0.9rem;
    line-height: 2;
  }
  .terminal .prompt::before { content: '> '; color: #888; }
  .cmd-input {
    background: #000; color: #00ff41; border: none; border-bottom: 1px solid #00ff41;
    font-family: monospace; font-size: 0.9rem; width: 200px; outline: none; padding: 2px 4px;
  }
  .log-link, .file-link {
    color: #00ff41; text-decoration: underline; cursor: pointer;
    display: inline-block; margin: 3px 14px 3px 0; font-family: monospace;
  }
  .file-link { display: block; margin: 6px 0; }
  .log-link:hover, .file-link:hover { color: #fff; }
  .back-btn {
    background: none; border: 1px solid #00ff41; color: #00ff41;
    padding: 8px 18px; cursor: pointer; font-family: monospace;
    font-size: 0.85rem; margin-top: 20px;
  }
  .back-btn:hover { background: #001a00; }
  .err { color: #ff4444; }
  .sys { color: #888; font-size: 0.8rem; }

  .form-field { margin-bottom: 16px; }
  .form-field label { display: block; font-size: 0.85rem; margin-bottom: 6px; color: #00ff41; }
  .form-field input {
    background: #000; color: #00ff41; border: 1px solid #00ff41;
    padding: 10px 12px; font-family: monospace; font-size: 0.9rem; width: 100%;
  }
  .form-field input:focus { outline: none; border-color: #fff; }

  .award { border: 2px solid #00ff41; padding: 32px 24px; text-align: center; animation: glow 2.5s infinite; }
  @keyframes glow {
    0%,100% { box-shadow: 0 0 10px #00ff41; }
    50% { box-shadow: 0 0 30px #00ff41, 0 0 60px #00ff41; }
  }
  .moon-big {
    font-size: 7rem; display: block; text-align: center;
    filter: drop-shadow(0 0 20px #aaa) drop-shadow(0 0 60px #666);
  }

  /* ============ ページ番号 ============ */
  #page-indicator {
    position: fixed; bottom: 16px; right: 18px; z-index: 60;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 18px; padding: 5px 16px; font-size: 0.78rem;
    color: var(--accent-deep); box-shadow: var(--shadow);
    font-family: 'Shippori Mincho', serif; letter-spacing: 1px;
  }
  body.dark #page-indicator {
    background: #000; border: 1px solid #00ff41; color: #00ff41;
    border-radius: 0; font-family: monospace;
  }

  /* ============ メモ帳 ============ */
  #memo-panel {
    position: fixed; top: 0; right: -340px; width: 320px; height: 100vh;
    background: var(--card); border-left: 1px solid var(--border);
    z-index: 100; transition: right 0.3s ease; overflow-y: auto;
    box-shadow: -4px 0 20px rgba(0,0,0,0.1); padding: 24px 20px;
  }
  #memo-panel.open { right: 0; }
  body.dark #memo-panel { background: #000; border-left: 1px solid #00ff41; }
  #memo-panel h3 {
    margin: 0 0 18px; font-size: 1rem; letter-spacing: 2px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .memo-item {
    padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px;
    margin-bottom: 7px; font-size: 0.82rem; cursor: pointer;
    display: flex; justify-content: space-between; gap: 8px;
    transition: background 0.2s;
  }
  .memo-item:hover { background: var(--sub); }
  body.dark .memo-item { border-radius: 0; border-color: #1a3a1a; }
  body.dark .memo-item:hover { background: #0a0a0a; }
  .memo-page-no { color: #b0a088; font-size: 0.75rem; white-space: nowrap; }
  body.dark .memo-page-no { color: #555; }
  .memo-empty { font-size: 0.82rem; color: #b0a088; }

  /* ============ トースト ============ */
  #toast {
    position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--accent-deep); color: #fff; padding: 12px 28px;
    border-radius: 24px; font-size: 0.85rem; opacity: 0; pointer-events: none;
    transition: all 0.35s; z-index: 200; letter-spacing: 1px;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  body.dark #toast { background: #00ff41; color: #000; border-radius: 0; }

  footer {
    text-align: center; font-size: 0.75rem; color: #b0a088;
    padding: 36px 20px; border-top: 1px solid var(--border);
    letter-spacing: 1px;
  }
  body.dark footer { color: #555; border-color: #1a3a1a; }

  .access-table { width: 100%; border-collapse: collapse; margin-top: 8px; }
  .access-table td {
    padding: 12px 8px; font-size: 0.9rem; line-height: 1.8;
    border-bottom: 1px dotted var(--border); vertical-align: top;
  }
  .access-table td:first-child { width: 110px; white-space: nowrap; color: var(--accent-deep); }
</style>
</head>

<template id="tpl-3.1">
<div class="card">

<script>
  let currentPage = 1;
  let darkMode = false;
  let memoData = []; // [{page, label}]
  const visitedFiles = new Set();
  const allFiles = [37,38,39,40,41];

  const logMap = {
    '回収': 27, '配送': 28, '満月便': 29, '会議': 30,
    '当選': 31, '異常': 32, '空欄': 33, '捜索': 34, '緊急会議': 35
  };

  const pageNames = {
    1:'トップ', 2:'カフェについて', 3:'うさぎたち', 3.1:'ラピ', 4:'モカ', 5:'きなこ', 6:'ノエル',
    7:'メニュー', 8:'アクセス', 9:'よくある質問', 10:'満月ノート', 11:'バイト募集',
    12:'スタッフ紹介', 13:'イベント情報', 14:'ギャラリー', 15:'お知らせ',
    16:'ブログ(10/8-10)', 17:'ブログ(10/12)', 18:'ブログ(10/14)', 19:'ブログ(11/1)',
    22:'イベントレポート', 23:'ブログ(10/16 ノート)', 25:'ブログ(10/17 足ダン)',
    26:'業務ターミナル', 27:'ログ:回収', 28:'ログ:配送', 29:'ログ:満月便', 30:'ログ:会議',
    31:'ログ:当選', 32:'ログ:異常', 33:'ログ:空欄', 34:'ログ:捜索', 35:'緊急会議',
    36:'ARCHIVE', 37:'10-11_event.jpg', 38:'note_1011.txt', 39:'blog_1105.txt',
    40:'lost_property.jpg', 41:'err_not_found.log',
    45:'案件ステータス', 46:'月光郵便局', 47:'Carrotとは', 48:'真相', 49:'協力要請', 50:'採用通知'
  };

  /* ===== 保存処理（自前ホスティング時はlocalStorageに書き換え可） ===== */
  async function saveMemo() {
    try {
      await window.storage.set('moon_memo', JSON.stringify(memoData));
    } catch (e) { /* 保存失敗時はメモリ内のみで継続 */ }
  }
  async function loadMemo() {
    try {
      const r = await window.storage.get('moon_memo');
      if (r && r.value) {
        memoData = JSON.parse(r.value);
        renderMemoList();
      }
    } catch (e) { /* 初回は記録なし */ }
  }
  async function deleteMemoStorage() {
    try { await window.storage.delete('moon_memo'); } catch (e) {}
  }

  /* ===== ページ遷移 ===== */
  function goTo(n) {
    if (allFiles.includes(n)) visitedFiles.add(n);
    currentPage = n;
    recordVisit(n);
    render();
  }

  function render() {
    const main = document.getElementById('main');
    const tpl = document.getElementById('tpl-' + currentPage);
    if (!tpl) { main.innerHTML = '<div class="card"><p>ページが見つかりません。</p></div>'; updateIndicator(); return; }

    const div = document.createElement('div');
    div.className = 'page active';
    div.innerHTML = tpl.innerHTML;
    main.innerHTML = '';
    main.appendChild(div);

    if (currentPage === 36) updateArchiveProgress();
    if (currentPage >= 26 && !darkMode) enableDark();

    updateIndicator();
    window.scrollTo(0,0);
  }

  function updateIndicator() {
    const n = Math.floor(currentPage);
    document.getElementById('page-indicator').textContent = n + '/50';
  }

  function enableDark() {
    darkMode = true;
    document.body.classList.add('dark');
    document.getElementById('site-title').textContent = '[ 月光郵便局 ]';
    document.getElementById('site-title').onclick = () => goTo(26);
    document.getElementById('main-nav').style.display = 'none';
    document.getElementById('footer-text').textContent = '[ MOONLIGHT POST OFFICE SYSTEM ]';
    document.getElementById('search-input').placeholder = 'コマンド入力...';
  }

  /* ===== 検索 ===== */
  function doSearch() {
    const inp = document.getElementById('search-input');
    const val = inp.value.trim();
    inp.value = '';
    if (val.toLowerCase() === 'carrot') { goTo(26); return; }
    if (darkMode) {
      if (logMap[val]) { goTo(logMap[val]); return; }
      if (val.toUpperCase() === 'ARCHIVE') { goTo(36); return; }
      showToast('ERR: 認識できないコマンドです');
      return;
    }
    const map = {'ラピ':3.1,'らぴ':3.1,'モカ':4,'もか':4,'きなこ':5,'キナコ':5,'ノエル':6,'のえる':6};
    if (map[val] !== undefined) { goTo(map[val]); return; }
    showToast('「' + val + '」は見つかりませんでした');
  }

  /* ===== メモ帳 ===== */
  function recordVisit(n) {
    const label = pageNames[n];
    if (!label) return;
    if (memoData.some(m => m.page === n)) return;
    memoData.push({ page: n, label: label });
    renderMemoList();
    saveMemo();
  }

  function renderMemoList() {
    const list = document.getElementById('memo-list');
    if (memoData.length === 0) {
      list.innerHTML = '<p class="memo-empty">まだ記録がありません。</p>';
      return;
    }
    list.innerHTML = '';
    memoData.forEach(m => {
      const d = document.createElement('div');
      d.className = 'memo-item';
      d.innerHTML = '<span>' + m.label + '</span><span class="memo-page-no">' + Math.floor(m.page) + '/50</span>';
      d.onclick = () => { goTo(m.page); };
      list.appendChild(d);
    });
  }

  function toggleMemo() {
    document.getElementById('memo-panel').classList.toggle('open');
  }

  function clearMemo() {
    if (confirm('本当に消しますか？')) {
      memoData = [];
      renderMemoList();
      deleteMemoStorage();
      showToast('記録を消しました');
    }
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2200);
  }

  /* ===== ターミナル ===== */
  function termCmd(cmd) {
    if (logMap[cmd]) { goTo(logMap[cmd]); return; }
    if (cmd.toUpperCase() === 'ARCHIVE') { goTo(36); return; }
  }

  function runCmd() {
    const inp = document.getElementById('cmd-input');
    if (!inp) return;
    const val = inp.value.trim();
    if (logMap[val]) { goTo(logMap[val]); return; }
    if (val.toUpperCase() === 'ARCHIVE') { goTo(36); return; }
    const res = document.getElementById('cmd-result');
    if (res) res.innerHTML = '<p class="err">ERR: コマンド「' + val + '」は認識されませんでした。</p>';
  }

  function runCmd35() {
    const inp = document.getElementById('cmd-input-35');
    if (inp && inp.value.trim().toUpperCase() === 'ARCHIVE') { goTo(36); }
    else if (inp) { inp.style.borderColor = '#f44'; }
  }

  function updateArchiveProgress() {
    const p = document.getElementById('archive-progress');
    const btn = document.getElementById('to-45-btn');
    if (!p) return;
    p.textContent = '閲覧済み：' + visitedFiles.size + ' / ' + allFiles.length + ' ファイル';
    if (allFiles.every(f => visitedFiles.has(f)) && btn) {
      btn.style.display = 'block';
    }
  }

  /* ===== 解答判定 ===== */
  function submitAnswer() {
    const name = document.getElementById('ans-name').value.trim();
    const wish = document.getElementById('ans-wish').value.trim();
    const err = document.getElementById('ans-err');

    const nameOk = name.match(/藤井|山崎|Y\.Y|YY|ゆい|結衣/);
    const wishOk = wish.match(/プロポーズ|結婚|婚|一緒|入籍|ゆびわ|指輪/);

    if (nameOk && wishOk) {
      goTo(50);
    } else {
      err.textContent = '記録が一致しません。もう少し探してみてください。';
    }
  }

  /* ===== 初期化 ===== */
  document.getElementById('search-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') doSearch();
  });

  loadMemo();
  recordVisit(1);
  render();
</script>
