<style>
  :root {
    --bg: #fdf6ee;
    --text: #5a3e2b;
    --accent: #e8a87c;
    --sub: #f5dfc5;
    --card: #fffaf4;
    --border: #e0c9a6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Hiragino Maru Gothic Pro', 'BIZ UDPGothic', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    transition: all 0.01s;
  }
  body.dark {
    --bg: #000;
    --text: #c8ffc8;
    --accent: #00ff41;
    --sub: #0a0a0a;
    --card: #050505;
    --border: #1a3a1a;
    font-family: 'Courier New', 'MS Gothic', monospace;
  }
  body.dark #site-header { background: #000; border-bottom: 1px solid #1a3a1a; }
  body.dark #site-header h1 { color: #00ff41; font-family: monospace; }
  body.dark nav a { color: #888; }

  #site-header {
    background: var(--sub);
    border-bottom: 2px solid var(--border);
    padding: 12px 20px;
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 8px;
  }
  #site-header h1 { font-size: 1.3rem; color: var(--accent); letter-spacing: 2px; }
  nav { display: flex; gap: 12px; flex-wrap: wrap; }
  nav a {
    font-size: 0.8rem; color: var(--text); text-decoration: none;
    padding: 4px 8px; border-radius: 20px;
    transition: background 0.2s;
    cursor: pointer;
  }
  nav a:hover { background: var(--sub); }
  body.dark nav a:hover { background: #111; }

  #main { max-width: 820px; margin: 0 auto; padding: 24px 16px; }

  .page { display: none; animation: fadein 0.4s; }
  .page.active { display: block; }
  @keyframes fadein { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform:none; } }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
  }
  body.dark .card { border-radius: 0; border-color: #1a3a1a; }
  h2 { font-size: 1.2rem; margin-bottom: 12px; color: var(--accent); }
  body.dark h2 { color: #00ff41; }
  p { line-height: 1.9; font-size: 0.92rem; margin-bottom: 10px; }
  .tag {
    display: inline-block; background: var(--sub); border: 1px solid var(--border);
    border-radius: 20px; padding: 2px 10px; font-size: 0.78rem; margin: 2px;
  }
  .bunny-card {
    display: inline-block; background: var(--card);
    border: 1px solid var(--border); border-radius: 12px;
    padding: 16px; margin: 8px; width: 160px; text-align: center; vertical-align: top;
  }
  .bunny-face { font-size: 2.8rem; }
  .bunny-name { font-weight: bold; font-size: 1rem; color: var(--accent); }
  body.dark .bunny-name { color: #00ff41; }
  .btn {
    background: var(--accent); color: #fff; border: none;
    padding: 10px 24px; border-radius: 24px; cursor: pointer;
    font-size: 0.9rem; transition: opacity 0.2s;
  }
  .btn:hover { opacity: 0.8; }
  body.dark .btn { background: #00ff41; color: #000; border-radius: 0; }

  /* 検索窓 */
  #search-box { display: flex; gap: 8px; margin: 16px 0; }
  #search-input {
    flex: 1; padding: 10px 16px; border: 2px solid var(--border);
    border-radius: 24px; font-size: 1rem;
    background: #fff; color: var(--text);
    font-family: inherit;
  }
  body.dark #search-input {
    background: #000; color: #00ff41; border-color: #1a3a1a; border-radius: 0;
    border: 1px solid #00ff41;
  }

  /* ターミナル */
  .terminal {
    background: #000; color: #00ff41; font-family: monospace;
    padding: 20px; border: 1px solid #00ff41; font-size: 0.88rem;
    line-height: 1.8;
  }
  .terminal .prompt::before { content: '> '; color: #888; }
  #cmd-input {
    background: #000; color: #00ff41; border: none; border-bottom: 1px solid #00ff41;
    font-family: monospace; font-size: 0.9rem; width: 200px; outline: none; padding: 2px 4px;
  }
  .log-link {
    color: #00ff41; text-decoration: underline; cursor: pointer;
    display: block; margin: 3px 0; font-family: monospace;
  }
  .log-link:hover { color: #fff; }

  /* アーカイブ */
  .file-link {
    display: block; color: #00ff41; text-decoration: underline;
    cursor: pointer; margin: 4px 0; font-family: monospace; font-size: 0.9rem;
  }
  .file-link:hover { color: #fff; }
  .back-btn {
    background: none; border: 1px solid #00ff41; color: #00ff41;
    padding: 6px 16px; cursor: pointer; font-family: monospace;
    font-size: 0.85rem; margin-top: 16px;
  }
  .back-btn:hover { background: #001a00; }

  /* 月 */
  #moon-header {
    display: none;
    width: 100%; text-align: center; padding: 16px 0 8px;
    font-size: 5rem; line-height: 1;
    text-shadow: 0 0 40px #888, 0 0 80px #555;
    filter: grayscale(20%) contrast(1.3);
  }
  body.dark #moon-header { display: block; }

  /* ブログ */
  .blog-entry { border-left: 3px solid var(--accent); padding-left: 12px; margin-bottom: 16px; }
  body.dark .blog-entry { border-color: #00ff41; }
  .blog-date { font-size: 0.78rem; color: #999; margin-bottom: 4px; }

  /* 最終フォーム */
  .form-field { margin-bottom: 12px; }
  .form-field label { display: block; font-size: 0.85rem; margin-bottom: 4px; color: #00ff41; }
  .form-field input {
    background: #000; color: #00ff41; border: 1px solid #00ff41;
    padding: 8px 12px; font-family: monospace; font-size: 0.9rem; width: 100%;
  }
  .form-field input:focus { outline: none; border-color: #fff; }

  /* 採用通知 */
  .award { border: 2px solid #00ff41; padding: 24px; text-align: center; animation: glow 2s infinite; }
  @keyframes glow {
    0%,100% { box-shadow: 0 0 10px #00ff41; }
    50% { box-shadow: 0 0 30px #00ff41, 0 0 60px #00ff41; }
  }

  .moon-big {
    font-size: 8rem; display: block; text-align: center;
    filter: drop-shadow(0 0 20px #aaa) drop-shadow(0 0 60px #666);
    text-shadow: 0 0 40px rgba(200,200,200,0.8);
  }
  .err { color: #ff4444; }
  .sys { color: #888; font-size: 0.8rem; }

  .note-quote {
    border-left: 3px solid var(--accent); padding: 12px 16px;
    font-style: italic; background: var(--sub); border-radius: 0 8px 8px 0;
    margin: 12px 0;
  }
  body.dark .note-quote { background: #0a0a0a; border-color: #00ff41; font-style: normal; }

  footer {
    text-align: center; font-size: 0.75rem; color: #aaa;
    padding: 24px; border-top: 1px solid var(--border); margin-top: 32px;
  }
</style>
</head>

<script>
  let currentPage = 1;
  let darkMode = false;
  const visitedFiles = new Set();
  const allFiles = [37,38,39,40,41];

  const logMap = {
    '回収': 27, '配送': 28, '満月便': 29, '会議': 30,
    '当選': 31, '異常': 32, '空欄': 33, '捜索': 34, '緊急会議': 35
  };

  function goTo(n) {
    currentPage = n;
    render();
  }

  function render() {
    const main = document.getElementById('main');
    const tpl = document.getElementById('tpl-' + currentPage);
    if (!tpl) { main.innerHTML = '<div class="card"><p>ページが見つかりません。</p></div>'; return; }

    const div = document.createElement('div');
    div.className = 'page active';
    div.innerHTML = tpl.innerHTML;
    main.innerHTML = '';
    main.appendChild(div);

    // アーカイブ進捗
    if (currentPage === 36) updateArchiveProgress();

    // 裏ページ遷移
    if (currentPage >= 26 && !darkMode) enableDark();

    window.scrollTo(0,0);
  }

  function enableDark() {
    darkMode = true;
    document.body.classList.add('dark');
    document.getElementById('site-title').textContent = '[ 月光郵便局 ]';
    document.getElementById('main-nav').style.display = 'none';
    document.getElementById('site-footer').style.borderColor = '#1a3a1a';
    document.getElementById('footer-text').textContent = '[ MOONLIGHT POST OFFICE SYSTEM ]';
  }

  function doSearch() {
    const val = document.getElementById('search-input').value.trim().toLowerCase();
    if (val === 'carrot') { goTo(26); return; }
    const map = {'ラピ':'3.1','モカ':'4','きなこ':'5','ノエル':'6'};
    if (map[val]) { goTo(parseFloat(map[val])); return; }
    alert('「' + val + '」は見つかりませんでした。');
  }

  function termCmd(cmd) {
    if (logMap[cmd]) { goTo(logMap[cmd]); return; }
    if (cmd.toUpperCase() === 'ARCHIVE') { goTo(36); return; }
  }

  function runCmd() {
    const inp = document.getElementById('cmd-input');
    if (!inp) return;
    const val = inp.value.trim();
    if (logMap[val]) { goTo(logMap[val]); return; }
    if (val.toUpperCase() === 'ARCHIVE') { goTo(36); return; }
    const res = document.getElementById('cmd-result');
    if (res) res.innerHTML = '<p class="err">ERR: コマンド「' + val + '」は認識されませんでした。</p>';
  }

  function runCmd35() {
    const inp = document.getElementById('cmd-input-35');
    if (inp && inp.value.trim().toUpperCase() === 'ARCHIVE') { goTo(36); }
    else { inp.style.borderColor = '#f44'; }
  }

  function updateArchiveProgress() {
    allFiles.forEach(f => {
      if (visitedFiles.has(f)) return;
    });
    const p = document.getElementById('archive-progress');
    const btn = document.getElementById('to-45-btn');
    if (!p) return;
    p.textContent = '閲覧済み：' + visitedFiles.size + ' / ' + allFiles.length + ' ファイル';
    if (allFiles.every(f => visitedFiles.has(f)) && btn) {
      btn.style.display = 'block';
    }
  }

  // ファイルページ訪問追跡
  const origGoTo = goTo;
  window.goTo = function(n) {
    if ([37,38,39,40,41].includes(n)) visitedFiles.add(n);
    origGoTo(n);
  };

  // 初期表示
  render();

  document.getElementById('search-input') && document.getElementById('search-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') doSearch();
  });

  function submitAnswer() {
    const name = document.getElementById('ans-name').value.trim();
    const wish = document.getElementById('ans-wish').value.trim();
    const err = document.getElementById('ans-err');

    const nameOk = name.match(/藤井|山崎|Y\.Y|YY|ゆい|結衣/);
    const wishOk = wish.match(/プロポーズ|結婚|婚|一緒|入籍|ゆびわ|指輪/);

    if (nameOk && wishOk) {
      goTo(50);
    } else {
      err.textContent = '記録が一致しません。もう少し探してみてください。';
    }
  }
</script>
</body>
</html>
